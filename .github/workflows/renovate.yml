# Renovate runs here, not on Mend's hosted app, whose queue left this repo's jobs pending.
# It reads renovate.json and opens one PR per engine update. Nothing deploys: test each PR on the machine first.
name: Renovate
"on":
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      # A fine-grained token for this repo only (Contents, Pull requests: read and write).
      # GITHUB_TOKEN would work, but its PRs do not start CI.
      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
