---
# Keeps one release PR open with the next version and CHANGELOG.md, from the conventional commits.
# Merge that PR to tag vX.Y.Z and publish the GitHub release.
name: Release Please
"on":
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      pull-requests: write # open and update the release PR
    steps:
      - name: Update the release PR or publish the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
