---
# End-to-end test: start each engine, wait for its model, send one chat request, check the answer.
# Run one engine: ansible-playbook test.yml -e '{"engines": ["strata"]}'. Engines without a service are skipped.
- name: Test the engines
  hosts: all
  become: true
  vars:
    engines: [strata, halogen, maya]
    ports: {strata: "{{ strata_port }}", maya: "{{ maya_port }}", halogen: "{{ halogen_port }}"}
    auth: "{{ {'Authorization': 'Bearer ' ~ (strata_key.stdout | regex_search('sk-strata-\\S+'))} if engine == 'strata' else {} }}"
  tasks:
    - name: Find the installed engines
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "{{ engines | map('regex_replace', '$', '.service') | list }}"
      register: units

    - name: Keep the installed engines
      ansible.builtin.set_fact:
        installed: "{{ engines | select('in', units.files | map(attribute='path') | map('basename') | map('regex_replace', '[.]service$', '') | list) | list }}"

    - name: Require at least one installed engine
      ansible.builtin.assert:
        that: installed | length > 0
        fail_msg: No requested engine is installed. Install an engine before this test.

    - name: Read the Strata API key
      ansible.builtin.command: /home/{{ ansible_user }}/.local/bin/strata launch --show-key --preset {{ strata_preset }}
      become: false
      register: strata_key
      no_log: true
      changed_when: false
      when: "'strata' in installed"

    - name: Test engines and restore the default
      block:
        - name: Test each engine
          ansible.builtin.include_tasks: tests/engine.yml
          loop: "{{ installed }}"
          loop_control:
            loop_var: engine
      always:
        - name: Start the default engine again
          ansible.builtin.systemd_service:
            name: "{{ default_engine }}"
            state: started
