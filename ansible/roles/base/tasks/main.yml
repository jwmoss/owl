---
- name: Install the build tools
  ansible.builtin.apt:
    name: [build-essential, cmake, ninja-build, git, pipx, python3-venv, libnuma1, libelf1t64, libdrm-amdgpu1]
    update_cache: true

- name: Allow passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ ansible_user }}"
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Add the user to the GPU groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: [render, video]
    append: true

- name: Install the Hugging Face CLI (libosmos downloads with it)
  community.general.pipx:
    name: huggingface-hub
  become: false

# The token stays on the Mac that runs Ansible (~/.cache/huggingface/token). Downloads are throttled without it.
- name: Copy the Hugging Face token
  ansible.builtin.copy:
    src: ~/.cache/huggingface/token
    dest: "/home/{{ ansible_user }}/.cache/huggingface/token"
    mode: "0600"
  become: false
