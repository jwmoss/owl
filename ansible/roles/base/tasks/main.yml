---
# A frame buffer left at its default (often 64 GB) hides that memory from Linux, and no engine fits.
- name: Check that Linux sees about 128 GB of memory
  ansible.builtin.assert:
    that: ansible_facts.memtotal_mb >= 115000
    fail_msg: >-
      Linux sees {{ ansible_facts.memtotal_mb }} MB. The engines need a 128 GB machine with the BIOS
      UMA frame buffer at its minimum (docs/01-ubuntu-install.md).

- name: Install the build tools
  ansible.builtin.apt:
    name: [build-essential, cmake, ninja-build, git, pipx, python3-venv, libnuma1, libelf1t64, libdrm-amdgpu1]
    update_cache: true

- name: Allow passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ ansible_user }}"
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Add the user to the GPU groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: [render, video]
    append: true

# Rootless Podman (gufo, halogen) needs /run/user/<uid>. Without linger, systemd removes it at the last logout.
- name: Keep the user session when nobody is logged in
  ansible.builtin.command: loginctl enable-linger {{ ansible_user }}
  args:
    creates: /var/lib/systemd/linger/{{ ansible_user }}

- name: Install the Hugging Face CLI (libosmos downloads with it)
  community.general.pipx:
    name: huggingface-hub
  become: false

# Optional: the token on the computer that runs Ansible (hf auth login). Hugging Face throttles downloads without it.
- name: Copy the Hugging Face token
  ansible.builtin.copy:
    src: ~/.cache/huggingface/token
    dest: "/home/{{ ansible_user }}/.cache/huggingface/token"
    mode: "0600"
  become: false
  when: "'~/.cache/huggingface/token' | expanduser is file"

# The GPU driver frees an engine's memory some seconds after its process stops.
# Each engine service runs this first, so a new engine does not start out of memory.
- name: Install the wait-for-free-memory script
  ansible.builtin.copy:
    dest: /usr/local/bin/owl-wait-memory
    mode: "0755"
    content: |
      #!/bin/sh
      # Wait up to 80 seconds (inside the systemd start timeout) until MemAvailable is at least 100 GiB.
      i=0
      while [ "$(awk '/MemAvailable/ {print $2}' /proc/meminfo)" -lt 104857600 ]; do
        i=$((i + 1))
        [ "$i" -gt 40 ] && { echo "owl-wait-memory: less than 100 GiB free after 80 seconds" >&2; exit 1; }
        sleep 2
      done
