---
# Copies an engine's model files from the store before its download, so the engine downloads only what is missing.
- name: Copy the model files from the store, {{ model_cache_engine }}
  ansible.builtin.shell: >-
    mkdir -p {{ model_cache_dir }}/owl/{{ model_cache_engine }} {{ models_dir }}/{{ model_cache_engine }}
    && rsync -rlt --exclude='.*.??????' --itemize-changes {{ model_cache_dir }}/owl/{{ model_cache_engine }}/ {{ models_dir }}/{{ model_cache_engine }}/
  register: model_cache_pull
  changed_when: model_cache_pull.stdout | length > 0
  become: false
  async: 21600
  poll: 30
