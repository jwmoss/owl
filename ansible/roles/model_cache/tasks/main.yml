---
# The model store: a backup of every model on the share; the engines run from the SSD. Over 1 Gbps a model loads too slowly to run from NFS.
# Every copy skips rsync's temporary files (.<name>.XXXXXX), which a killed copy can leave behind,
# and the store's .done marker.
- name: Install the NFS client and rsync
  ansible.builtin.apt:
    name: [nfs-common, rsync]

# automount waits for the network and Tailscale names at first use, so a missing share never stops a boot.
- name: Mount the model cache from {{ model_cache_nfs }}
  ansible.posix.mount:
    src: "{{ model_cache_nfs }}"
    path: "{{ model_cache_dir }}"
    fstype: nfs
    opts: rw,hard,noatime,_netdev,nofail,x-systemd.automount
    state: mounted
