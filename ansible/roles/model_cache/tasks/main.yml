---
# The model store: a backup of every model on the share; the engines run from the SSD. Over 1 Gbps a model loads too slowly to run from NFS.
- name: Install the NFS client and rsync
  ansible.builtin.apt:
    name: [nfs-common, rsync]

# An Unraid user share can change a file's ID, and the mount then gives "Stale file handle" on every access.
# A lazy unmount lets automount mount the share again at the next access.
- name: Unmount a stale model cache
  ansible.builtin.shell: >-
    ! findmnt -n -t nfs,nfs4 {{ model_cache_dir }} >/dev/null
    || timeout 20 stat {{ model_cache_dir }} >/dev/null 2>&1
    || { umount -l {{ model_cache_dir }} && echo unmounted; }
  register: model_cache_stale
  changed_when: "'unmounted' in model_cache_stale.stdout"

# automount waits for the network and Tailscale names at first use, so a missing share never stops a boot.
- name: Mount the model cache from {{ model_cache_nfs }}
  ansible.posix.mount:
    src: "{{ model_cache_nfs }}"
    path: "{{ model_cache_dir }}"
    fstype: nfs
    opts: rw,hard,noatime,_netdev,nofail,x-systemd.automount
    state: mounted
