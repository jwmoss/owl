---
- name: Install Podman
  ansible.builtin.apt:
    name: [podman, crun, aria2]

- name: Copy halogen from the model store
  ansible.builtin.include_role:
    name: model_cache
    tasks_from: pull
  vars:
    model_cache_engine: halogen
  when: model_cache_nfs | length > 0

- name: Download the halogen v2 checkpoint and its lookup table (about 120 GB)
  ansible.builtin.command:
    cmd: >-
      hf download peonist-ai/halogen-qwen3.8-flash-next --revision {{ halogen_weights_revision }}
      --exclude "*w4b*" --exclude "*ht43*" --local-dir {{ models_dir }}/halogen
  environment:
    PATH: "/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
    HF_HUB_DISABLE_XET: "1" # Xet downloads stalled in testing; plain HTTP does not
  become: false
  changed_when: false # hf download skips the files it has
  async: 43200
  poll: 60

# The uncensored build: Quat3rnion's r2 transplant of orcarouter's refusal-direction edit into
# peonist's v2. Pinned to r2 because only r2 is validated against the stock lookup table and
# tokenizer. The checkpoint carries its own MTP head, so the unit needs no other change.
- name: Download the abliterated checkpoint and check its SHA-256 (about 89 GB)
  ansible.builtin.command:
    cmd: >-
      aria2c https://huggingface.co/Quat3rnion/halogen-qwen3.8-flash-next-v2-abliterated/resolve/{{
      halogen_abliterated_revision }}/qwen38-flash-next-v2-abliterated.hgn
      --dir {{ models_dir }}/halogen --out qwen38-flash-next-v2-abliterated.hgn
      --checksum sha-256={{ halogen_abliterated_sha256 }} --check-integrity --continue
      --max-connection-per-server 8 --split 8 --min-split-size 64M --auto-file-renaming=false
      --file-allocation=falloc --max-tries 20 --retry-wait 10 --summary-interval 0 --console-log-level warn
  become: false
  changed_when: false # a complete file only gets its SHA-256 checked
  async: 43200
  poll: 60
  when: halogen_abliterated

- name: Save halogen to the model store
  ansible.builtin.include_role:
    name: model_cache
    tasks_from: push
  vars:
    model_cache_engine: halogen
  when: model_cache_nfs | length > 0

# GPU and NPU work at once can hang Strix Halo unless the GPU fabric clock is held (ROCm/TheRock#8709).
# Rootless Podman cannot hold it, so halogen's own unit does, at the same version as the image.
- name: Install halogen's fabric clock unit for the NPU
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/peonist-ai/halogen-flash-server/v{{ halogen_image.split(':')[-1] }}/deploy/host/{{ item.name }}
    dest: "{{ item.dest }}/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: halogen-fabric-clock, dest: /usr/local/sbin, mode: "0755" }
    - { name: halogen-fabric-clock.service, dest: /etc/systemd/system, mode: "0644" }
  when: halogen_npu_models | length > 0

- name: Hold the GPU fabric clock at every boot
  ansible.builtin.systemd_service:
    name: halogen-fabric-clock
    enabled: true
    state: started
    daemon_reload: true
  changed_when: false # a oneshot that exits, so each start only holds the clock again
  when: halogen_npu_models | length > 0

# Closed-source engine under the Peonist EULA (free, no telemetry). Without HALOGEN_DOWNLOAD it opens no outbound connections.
# With NPU models it gets HALOGEN_DOWNLOAD and a writable volume to fetch them into models_dir/halogen/npu (skips files it has).
- name: Install the halogen service
  register: halogen_unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/halogen.service
    mode: "0644"
    content: |
      [Unit]
      Description=halogen Qwen3.8-Flash-Next API (port {{ halogen_port }})
      After=network-online.target
      Wants=network-online.target
      {% if halogen_npu_models %}
      After=halogen-fabric-clock.service
      {% endif %}
      Conflicts=strata.service maya.service gufo.service

      [Service]
      User={{ ansible_user }}
      {% if halogen_npu_models %}
      # The NPU pins its models in memory; a service's default memlock limit is 8 MiB.
      LimitMEMLOCK=infinity
      {% endif %}
      ExecStart=/usr/bin/podman run --rm --name halogen -p {{ halogen_port }}:8731 \
        --device /dev/kfd --device /dev/dri --group-add keep-groups --ipc=host --ulimit memlock=-1:-1 \
        -e HALOGEN_CHECKPOINT=/models/qwen38-flash-next-v2{{ '-abliterated' if halogen_abliterated else '' }}.hgn \
      {% for k, v in halogen_env.items() %}
        -e "{{ k }}={{ v }}" \
      {% endfor %}
      {% if halogen_npu_models %}
        --device /dev/accel/accel0 -e HALOGEN_NPU_MODELS={{ halogen_npu_models }} \
        -e HALOGEN_DOWNLOAD=peonist-ai/halogen-qwen3.8-flash-next \
      {% endif %}
        -v {{ models_dir }}/halogen:/models{{ '' if halogen_npu_models else ':ro' }} {{ halogen_image }}
      ExecStop=/usr/bin/podman stop halogen
      ExecStartPre=/usr/local/bin/owl-wait-memory
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

# Restart the default engine when its unit changes (a new image or setting), else make sure it runs.
- name: Set the halogen service state
  ansible.builtin.systemd_service:
    name: halogen
    enabled: "{{ default_engine == 'halogen' }}"
    state: "{{ ('restarted' if halogen_unit is changed else 'started') if default_engine == 'halogen' else omit }}"
    daemon_reload: true
