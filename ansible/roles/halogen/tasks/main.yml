---
- name: Install Podman
  ansible.builtin.apt:
    name: [podman, crun]

- name: Download the halogen v2 checkpoint and its lookup table (about 120 GB)
  ansible.builtin.command:
    cmd: >-
      hf download peonist-ai/halogen-qwen3.8-flash-next --revision {{ halogen_weights_revision }}
      --exclude "*w4b*" --exclude "*ht43*" --local-dir /home/{{ ansible_user }}/Models/halogen
  environment:
    PATH: "/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
    HF_HUB_DISABLE_XET: "1" # Xet downloads stalled on owl; plain HTTP does not
  become: false
  changed_when: false # hf download skips the files it has
  async: 43200
  poll: 60

# The uncensored build: Quat3rnion's r2 transplant of orcarouter's refusal-direction edit into
# peonist's v2. Pinned to r2 because only r2 is validated against the stock lookup table and
# tokenizer. The checkpoint carries its own MTP head, so the unit needs no other change.
- name: Download the abliterated checkpoint (about 89 GB)
  ansible.builtin.command:
    cmd: >-
      hf download Quat3rnion/halogen-qwen3.8-flash-next-v2-abliterated
      qwen38-flash-next-v2-abliterated.hgn --revision {{ halogen_abliterated_revision }}
      --local-dir /home/{{ ansible_user }}/Models/halogen
  environment:
    PATH: "/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
    HF_HUB_DISABLE_XET: "1" # Xet downloads stalled on owl; plain HTTP does not
  become: false
  changed_when: false # hf download skips the files it has
  async: 43200
  poll: 60
  when: halogen_abliterated

- name: Check the abliterated checkpoint SHA-256
  ansible.builtin.command:
    cmd: sha256sum /home/{{ ansible_user }}/Models/halogen/qwen38-flash-next-v2-abliterated.hgn
  register: halogen_abliterated_file
  changed_when: false
  failed_when: not halogen_abliterated_file.stdout.startswith(halogen_abliterated_sha256)
  when: halogen_abliterated

# Closed-source engine under the Peonist EULA (free, no telemetry). Without HALOGEN_DOWNLOAD it opens no outbound connections.
- name: Install the halogen service
  register: halogen_unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/halogen.service
    mode: "0644"
    content: |
      [Unit]
      Description=halogen Qwen3.8-Flash-Next API (port {{ halogen_port }})
      After=network-online.target
      Wants=network-online.target
      Conflicts=strata.service osmos.service maya.service gufo.service

      [Service]
      User={{ ansible_user }}
      ExecStart=/usr/bin/podman run --rm --name halogen -p {{ halogen_port }}:8731 \
        --device /dev/kfd --device /dev/dri --group-add keep-groups --ipc=host --ulimit memlock=-1:-1 \
        -e HALOGEN_CHECKPOINT=/models/qwen38-flash-next-v2{{ '-abliterated' if halogen_abliterated else '' }}.hgn \
        -v /home/{{ ansible_user }}/Models/halogen:/models:ro {{ halogen_image }}
      ExecStop=/usr/bin/podman stop halogen
      ExecStartPre=/usr/local/bin/owl-wait-memory
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

# Restart the default engine when its unit changes (a new image or setting), else make sure it runs.
- name: Set the halogen service state
  ansible.builtin.systemd_service:
    name: halogen
    enabled: "{{ default_engine == 'halogen' }}"
    state: "{{ ('restarted' if halogen_unit is changed else 'started') if default_engine == 'halogen' else omit }}"
    daemon_reload: true
