---
- name: Clone Project Maya
  ansible.builtin.git:
    repo: https://github.com/mw00/project-maya
    dest: "/home/{{ ansible_user }}/src/project-maya"
    version: "{{ maya_commit }}"
  become: false

# Builds the HIP engine and downloads Maya-XS (about 277 GB), the 128 GB quant. Each shard is checked by SHA-256.
- name: Set up Maya with DeepSeek-V4.1-Flash Maya-XS
  ansible.builtin.command:
    cmd: >-
      ./maya.sh --backend hip --gpu 0 --model deepseek-maya-xs --no-vision
      --yes --download-model --no-start --port {{ maya_port }}
    chdir: "/home/{{ ansible_user }}/src/project-maya"
    creates: "/home/{{ ansible_user }}/src/project-maya/maya-ds4-hip.json"
  environment:
    ROCM_PATH: /opt/rocm
    PATH: "/opt/rocm/bin:/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
  become: false
  async: 86400
  poll: 60

- name: Install the maya service
  register: maya_unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/maya.service
    mode: "0644"
    content: |
      [Unit]
      Description=Project Maya DeepSeek-V4.1-Flash API (port {{ maya_port }}, LAN, no key)
      After=network-online.target
      Wants=network-online.target
      Conflicts=strata.service osmos.service gufo.service halogen.service

      [Service]
      User={{ ansible_user }}
      ExecStart=/home/{{ ansible_user }}/src/project-maya/run-maya-ds4-hip.sh --host 0.0.0.0
      ExecStartPre=/usr/local/bin/owl-wait-memory
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

# Restart the default engine when its unit changes (a new image or setting), else make sure it runs.
- name: Set the maya service state
  ansible.builtin.systemd_service:
    name: maya
    enabled: "{{ default_engine == 'maya' }}"
    state: "{{ ('restarted' if maya_unit is changed else 'started') if default_engine == 'maya' else omit }}"
    daemon_reload: true
