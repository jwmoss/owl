---
- name: Clone Project Maya
  ansible.builtin.git:
    repo: https://github.com/mw00/project-maya
    dest: "{{ maya_dir }}"
    version: "{{ maya_commit }}"
  become: false

- name: Find the Maya models set up on this machine
  ansible.builtin.stat:
    path: "{{ maya_dir }}/{{ maya_marker }}"
  vars:
    maya_item: "{{ item }}"
  loop: "{{ maya_models.keys() | list }}"
  register: maya_markers

- name: Find the Maya models with a complete copy in the store
  ansible.builtin.stat:
    path: "{{ maya_store }}/{{ item }}/.done"
  loop: "{{ maya_models.keys() | list }}"
  register: maya_stored
  when: model_cache_nfs | length > 0

- name: Read the maya service state
  ansible.builtin.systemd_service:
    name: maya
  register: maya_service

- name: Compare the SSD with the served model in the store
  ansible.builtin.command: "{{ maya_mirror }} --dry-run --itemize-changes"
  register: maya_diff
  changed_when: maya_diff.rc != 0 or maya_diff.stdout | length > 0
  failed_when: false # a model not in the store yet: its setup below saves it
  become: false
  when: model_cache_nfs | length > 0

# A setup or a swap changes the model files, so maya stops first. It starts again at the end if it ran.
# A model without its setup here, or without a complete copy in the store, is set up; the served model goes first.
- name: Set up and swap the Maya models
  vars:
    maya_new: >-
      {{ (maya_markers.results | rejectattr('stat.exists') | map(attribute='item') | list
      + maya_stored.results | default([]) | rejectattr('skipped', 'defined') | rejectattr('stat.exists')
      | map(attribute='item') | list) | unique }}
    maya_order: "{{ maya_new | select('equalto', maya_model) | list + maya_new | reject('equalto', maya_model) | list }}"
  when: maya_new | length > 0 or maya_diff is changed
  block:
    - name: Stop maya before the model files change
      ansible.builtin.systemd_service:
        name: maya
        state: stopped
      when: maya_service.status.ActiveState == 'active'

    # Builds the HIP engine and downloads the model; Maya checks each shard by SHA-256 and skips files it has.
    # Each model writes its own start script (run-maya-ds4-hip.sh, run-maya-glm-...). The marker is a link to it,
    # named by the commit and the setup command. With a store, the setup takes the files the store has, saves the
    # model to the store, and then leaves only the served model on the SSD.
    - name: Set up the Maya models
      vars:
        maya_item: "{{ item }}"
      ansible.builtin.shell:
        cmd: >-
          {% if model_cache_nfs %}mkdir -p {{ maya_store }}/{{ item }} {{ maya_models_dir }} && {{ maya_pull }} && {% endif %}
          {{ maya_setup }}
          && for f in $(ls -t run-maya-*.sh); do ln -sfn "$f" {{ maya_marker }}; break; done
          {% if model_cache_nfs %}&& {{ maya_push }}{% if item != maya_model %} && {{ maya_mirror }}{% endif %}{% endif %}
        chdir: "{{ maya_dir }}"
      environment:
        ROCM_PATH: /opt/rocm
        PATH: "/opt/rocm/bin:/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
      become: false
      changed_when: true
      async: 86400
      poll: 60
      loop: "{{ maya_order }}"

    - name: Copy the served model to the SSD from the store
      ansible.builtin.command: "{{ maya_mirror }}"
      become: false
      changed_when: true
      async: 21600
      poll: 30
      when: model_cache_nfs | length > 0

- name: Install the maya service
  register: maya_unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/maya.service
    mode: "0644"
    content: |
      [Unit]
      Description=Project Maya {{ maya_model }} API (port {{ maya_port }}, LAN, no key)
      After=network-online.target
      Wants=network-online.target
      Conflicts=strata.service osmos.service gufo.service halogen.service

      [Service]
      User={{ ansible_user }}
      {% for k, v in (maya_env | combine(maya_models[maya_model].env | default({}))).items() %}
      Environment="{{ k }}={{ v }}"
      {% endfor %}
      ExecStart={{ maya_dir }}/{{ maya_marker }} --host 0.0.0.0
      ExecStartPre=/usr/local/bin/owl-wait-memory
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

# Restart the default engine when its unit changes (a new image or setting), else make sure it runs.
- name: Set the maya service state
  ansible.builtin.systemd_service:
    name: maya
    enabled: "{{ default_engine == 'maya' }}"
    state: "{{ ('restarted' if maya_unit is changed else 'started') if default_engine == 'maya' else omit }}"
    daemon_reload: true

# A maya that ran before the playbook runs again, on the new model when it changed.
- name: Start maya again if it ran before
  ansible.builtin.systemd_service:
    name: maya
    state: "{{ 'restarted' if maya_unit is changed else 'started' }}"
  when: default_engine != 'maya' and maya_service.status.ActiveState == 'active'
