---
- name: Clone Project Maya
  ansible.builtin.git:
    repo: https://github.com/mw00/project-maya
    dest: "{{ maya_dir }}"
    version: "{{ maya_commit }}"
  become: false

- name: Find the Maya models set up on this machine
  ansible.builtin.stat:
    path: "{{ maya_dir }}/{{ maya_marker }}"
  vars:
    maya_item: "{{ item }}"
  loop: "{{ maya_models.keys() | list }}"
  register: maya_markers

- name: Find the Maya models with a complete copy in the store
  ansible.builtin.stat:
    path: "{{ model_cache_dir }}/owl/maya/{{ item }}/.done"
  loop: "{{ maya_models.keys() | list }}"
  register: maya_stored
  when: model_cache_nfs | length > 0

- name: Read the maya service state
  ansible.builtin.systemd_service:
    name: maya
  register: maya_service

# Every listed model stays on the SSD: a model the store has comes back when its files are missing or old.
- name: Copy the Maya models from the store
  ansible.builtin.include_role:
    name: model_cache
    tasks_from: pull
  vars:
    model_cache_engine: maya/{{ item }}
  loop: "{{ maya_models.keys() | list }}"
  when: model_cache_nfs | length > 0

# A setup uses the GPU, so maya stops first. It starts again at the end if it ran.
# A model without its setup here, or without a complete copy in the store, is set up; the served model goes first.
- name: Set up the new Maya models
  vars:
    maya_new: >-
      {{ (maya_markers.results | rejectattr('stat.exists') | map(attribute='item') | list
      + maya_stored.results | default([]) | rejectattr('skipped', 'defined') | rejectattr('stat.exists')
      | map(attribute='item') | list) | unique }}
    maya_order: "{{ maya_new | select('equalto', maya_model) | list + maya_new | reject('equalto', maya_model) | list }}"
  when: maya_new | length > 0
  block:
    - name: Stop maya before the setup
      ansible.builtin.systemd_service:
        name: maya
        state: stopped
      when: maya_service.status.ActiveState == 'active'

    # Builds the HIP engine and downloads the model; Maya checks each shard by SHA-256 and skips files it has.
    # The setup writes a config named by the engine (maya-ds4-hip.json), so models on one engine overwrite it:
    # the marker is the model's own copy.
    - name: Set up the Maya models
      vars:
        maya_item: "{{ item }}"
      ansible.builtin.shell:
        cmd: >-
          {{ maya_setup }}
          && for f in $(ls -t maya-*.json); do grep -q '{{ maya_models_dir }}/' "$f" && cp "$f" {{ maya_marker }} && break; done
          && test -f {{ maya_marker }}
        chdir: "{{ maya_dir }}"
      environment:
        ROCM_PATH: /opt/rocm
        PATH: "/opt/rocm/bin:/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
      become: false
      changed_when: true
      async: 86400
      poll: 60
      loop: "{{ maya_order }}"

    - name: Save the new Maya models to the store
      ansible.builtin.include_role:
        name: model_cache
        tasks_from: push
      vars:
        model_cache_engine: maya/{{ item }}
      loop: "{{ maya_order }}"
      when: model_cache_nfs | length > 0

- name: Install and start the maya service
  ansible.builtin.include_role:
    name: base
    tasks_from: engine_unit
  vars:
    base_engine: maya
    base_engine_description: Project Maya {{ maya_model }} API (port {{ engine_port }}, LAN, no key)
    base_engine_service: |
      {% for k, v in (maya_env | combine(maya_models[maya_model].env | default({}))).items() %}
      Environment="{{ k }}={{ v }}"
      {% endfor %}
      WorkingDirectory={{ maya_dir }}
      ExecStart={{ maya_dir }}/.venv/bin/python {{ maya_dir }}/maya.py --config {{ maya_dir }}/{{ maya_marker }} \
        --port {{ engine_port }} --host 0.0.0.0
      # maya.py exits with 241 when it stops while it loads the model.
      SuccessExitStatus=241

# A maya that ran before the playbook runs again, on the new model when it changed.
- name: Start maya again if it ran before
  ansible.builtin.systemd_service:
    name: maya
    state: "{{ 'restarted' if base_engine_unit is changed else 'started' }}"
  when: default_engine != 'maya' and maya_service.status.ActiveState == 'active'
