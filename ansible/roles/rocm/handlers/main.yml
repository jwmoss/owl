---
- name: Run ldconfig
  ansible.builtin.command: ldconfig
  changed_when: true

- name: Apply the huge page setting
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/owl-thp.conf
  changed_when: true

- name: Update the initramfs and reboot
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true
  notify: Reboot

- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 900
