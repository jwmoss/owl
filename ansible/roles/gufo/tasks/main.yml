---
- name: Install Podman
  ansible.builtin.apt:
    name: [podman, crun, aria2]

- name: Download the MTP head and the picture reader (about 4 GB)
  ansible.builtin.command:
    cmd: >-
      hf download unsloth/Qwen3.8-Flash-Next-GGUF --revision {{ gufo_qwen_revision }}
      --include "MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf" --include "mmproj-BF16.gguf"
      --local-dir /home/{{ ansible_user }}/Models/gufo/qwen3.8-flash-next
  environment:
    PATH: "/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
    HF_HUB_DISABLE_XET: "1" # Xet downloads stalled in testing; plain HTTP does not
  become: false
  changed_when: false # hf download skips the files it has

- name: "Read the model's file list: {{ gufo_model_repo }}"
  ansible.builtin.uri:
    url: "https://huggingface.co/api/models/{{ gufo_model_repo }}/tree/{{ gufo_model_revision }}/{{ gufo_model_file | dirname }}"
  register: gufo_tree

# aria2c opens 8 connections for each file, resumes, and checks each file's SHA-256.
# hf download stalled or slowed to a few MB/s on its one connection for each file.
- name: Write the download list
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.cache/gufo-model.aria2"
    mode: "0600"
    content: |
      {% for f in gufo_tree.json if f.path is search('-of-[0-9]+[.]gguf$') %}
      https://huggingface.co/{{ gufo_model_repo }}/resolve/{{ gufo_model_revision }}/{{ f.path }}
        out={{ f.path }}
        checksum=sha-256={{ f.lfs.oid }}
      {% if gufo_hf_token %}
        header=Authorization: Bearer {{ gufo_hf_token }}
      {% endif %}
      {% endfor %}
  become: false
  no_log: true # the file holds the Hugging Face token

- name: "Download the model, about 112 GB: {{ gufo_model_repo }}"
  ansible.builtin.shell:
    cmd: >-
      aria2c --input-file /home/{{ ansible_user }}/.cache/gufo-model.aria2 --dir {{ gufo_model_dir }}
      --max-connection-per-server 8 --split 8 --min-split-size 64M --max-concurrent-downloads 3
      --continue --check-integrity --auto-file-renaming=false --file-allocation=falloc
      --max-tries 20 --retry-wait 10 --summary-interval 0 --console-log-level warn
      && touch {{ gufo_model_dir }}/.complete-{{ gufo_model_revision }}
    creates: "{{ gufo_model_dir }}/.complete-{{ gufo_model_revision }}"
  become: false
  async: 43200
  poll: 60

- name: Install the gufo service
  register: gufo_unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/gufo.service
    mode: "0644"
    content: |
      [Unit]
      Description=gufo {{ gufo_model_repo | basename }} API (port {{ gufo_port }})
      After=network-online.target
      Wants=network-online.target
      Conflicts=strata.service osmos.service maya.service halogen.service

      [Service]
      User={{ ansible_user }}
      ExecStart=/usr/bin/podman run --rm --name gufo --userns=keep-id:uid=1000,gid=1000 \
        --device /dev/kfd --device /dev/dri --group-add keep-groups --ulimit memlock=-1 \
        -p {{ gufo_port }}:8080 -v /home/{{ ansible_user }}/Models/gufo:/models:ro {{ gufo_image }} \
        gufo serve --host 0.0.0.0 --port 8080 llm --context 131072 --sessions 2 \
        --model /models/{{ gufo_model_repo | basename }}/{{ gufo_model_file }} \
        --speculative mtp --mtp-model /models/qwen3.8-flash-next/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
      ExecStop=/usr/bin/podman stop gufo
      ExecStartPre=/usr/local/bin/owl-wait-memory
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

# Restart the default engine when its unit changes (a new image or setting), else make sure it runs.
- name: Set the gufo service state
  ansible.builtin.systemd_service:
    name: gufo
    enabled: "{{ default_engine == 'gufo' }}"
    state: "{{ ('restarted' if gufo_unit is changed else 'started') if default_engine == 'gufo' else omit }}"
    daemon_reload: true
