---
- name: Download the Strata installer
  ansible.builtin.get_url:
    url: "https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}/install.sh"
    dest: /tmp/strata-install.sh
    mode: "0644"
  become: false

# The installer checks the release checksums and its signed feed.
- name: Install the Strata Terminal
  ansible.builtin.command: sh /tmp/strata-install.sh
  args:
    creates: "/home/{{ ansible_user }}/.local/bin/strata"
  environment:
    STRATA_FEED: "https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}"
  become: false

- name: Check the pinned Strata engine and control versions
  ansible.builtin.command: >-
    /home/{{ ansible_user }}/.local/bin/strata update --check --json
    --feed https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}
  become: false
  register: strata_update_check
  changed_when: false

- name: Apply the pinned Strata component update
  when: >-
    (strata_update_check.stdout | from_json).engine.status == 'available'
    or (strata_update_check.stdout | from_json).control.status == 'available'
  block:
    - name: Read installed services before the Strata update
      ansible.builtin.service_facts:

    - name: Stop engines before the Strata update test
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: [strata, osmos, maya, gufo, halogen]
      when: (item ~ '.service') in ansible_facts.services

    - name: Update Strata from the pinned signed feed
      ansible.builtin.command: >-
        /home/{{ ansible_user }}/.local/bin/strata update --yes --json
        --feed https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}
      become: false
      register: strata_update
      changed_when: true
      async: 3600
      poll: 15

# Downloads the engine and the model, writes the run config with a new API key, and starts serving.
- name: Set up Qwen3.8-Flash-Next (about 86 GB)
  ansible.builtin.command:
    cmd: >-
      /home/{{ ansible_user }}/.local/bin/strata launch --family qwen --model {{ strata_model }}
      --context {{ strata_context }} --access lan --port {{ strata_port }} --save-preset qwen --yes --no-tui
    creates: "/home/{{ ansible_user }}/.local/state/strata/launch/qwen.json"
  become: false
  async: 43200
  poll: 60
  notify: Stop the setup server

- name: Stop the setup server before systemd starts it
  ansible.builtin.meta: flush_handlers

- name: Install the strata service
  register: strata_unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/strata.service
    mode: "0644"
    content: |
      [Unit]
      Description=Strata Qwen3.8-Flash-Next API (port {{ strata_port }}, API key required)
      After=network-online.target
      Wants=network-online.target
      Conflicts=osmos.service maya.service gufo.service halogen.service

      [Service]
      User={{ ansible_user }}
      ExecStart=/home/{{ ansible_user }}/.local/bin/strata serve --host 0.0.0.0 --port {{ strata_port }} \
        --profile /home/{{ ansible_user }}/.local/state/strata/launch/qwen.json
      ExecStartPre=/usr/local/bin/owl-wait-memory
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

# Restart the default engine when its unit changes (a new image or setting), else make sure it runs.
- name: Set the strata service state
  ansible.builtin.systemd_service:
    name: strata
    enabled: "{{ default_engine == 'strata' }}"
    state: "{{ ('restarted' if strata_unit is changed else 'started') if default_engine == 'strata' else omit }}"
    daemon_reload: true

- name: Restore the default engine after a Strata update
  ansible.builtin.systemd_service:
    name: "{{ {'libosmos': 'osmos'}.get(default_engine, default_engine) }}"
    state: started
  when: strata_update is changed and default_engine != 'strata'
