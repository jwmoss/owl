---
- name: Download the Strata installer
  ansible.builtin.get_url:
    url: "https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}/install.sh"
    dest: /tmp/strata-install.sh
    mode: "0644"
  become: false

# The installer checks the release checksums and its signed feed.
- name: Install the Strata Terminal
  ansible.builtin.command: sh /tmp/strata-install.sh
  args:
    creates: "{{ strata_bin }}"
  environment:
    STRATA_FEED: "https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}"
  become: false

- name: Check the pinned Strata engine and control versions
  ansible.builtin.command: >-
    {{ strata_bin }} update --check --json
    --feed https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}
  become: false
  register: strata_update_check
  changed_when: false
  check_mode: false # it only reads, and the next tasks need its output

- name: Check the Strata preset lists
  ansible.builtin.assert:
    that:
      - strata_install | difference(strata_presets.keys()) | length == 0
      - strata_preset in strata_install
    fail_msg: Every name in strata_install must be in strata_presets, and strata_preset must be in strata_install.

- name: Find the Strata presets set up on this machine
  ansible.builtin.stat:
    path: "{{ strata_state }}/{{ item }}.json"
  loop: "{{ strata_install }}"
  register: strata_preset_files

- name: Read the saved Strata presets
  ansible.builtin.slurp:
    src: "{{ strata_state }}/{{ item.item }}.json"
  loop: "{{ strata_preset_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: strata_saved
  no_log: true # the saved preset holds the API key

# Only a setup reads the context, so a saved preset whose context differs from the one set here is set up again.
- name: Note the Strata presets whose context changed
  ansible.builtin.set_fact:
    strata_resized: "{{ strata_resized | default([]) + [item.item.item] }}"
  loop: "{{ strata_saved.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  vars:
    strata_args: "{{ (item.content | b64decode | from_json).args | map('string') | list }}"
    strata_want: "{{ strata_presets[item.item.item].context | default(strata_context) | string | lower }}"
    strata_want_tokens: "{{ (strata_want[:-1] | int * 1024) if strata_want.endswith('k') else strata_want | int }}"
  when: "'--max-context' in strata_args and strata_args[strata_args.index('--max-context') + 1] | int != strata_want_tokens | int"

- name: Read the services before the Strata changes
  ansible.builtin.service_facts:

- name: Note whether strata runs
  ansible.builtin.set_fact:
    strata_was_running: "{{ ansible_facts.services['strata.service'].state | default('') == 'running' }}"

# An update test and a preset setup both start a Strata server, so the other engines stop first.
- name: Update Strata and set up new presets
  vars:
    strata_update: >-
      {{ (strata_update_check.stdout | from_json).engine.status == 'available'
      or (strata_update_check.stdout | from_json).control.status == 'available' }}
    # A preset without its setup here, or with a new context, is set up; the served one goes first.
    strata_new: >-
      {{ (strata_preset_files.results | rejectattr('stat.exists') | map(attribute='item') | list
      + strata_resized | default([])) | unique }}
    strata_order: "{{ strata_new | select('equalto', strata_preset) | list + strata_new | reject('equalto', strata_preset) | list }}"
  when: strata_update or strata_new | length > 0
  block:
    - name: Stop engines before the Strata changes
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: "{{ engines }}"
      when: (item ~ '.service') in ansible_facts.services

    - name: Update Strata from the pinned signed feed
      ansible.builtin.command: >-
        {{ strata_bin }} update --yes --json
        --feed https://github.com/Niko1221/Strata/releases/download/{{ strata_release }}
      become: false
      changed_when: true
      async: 3600
      poll: 15
      when: strata_update

    # Downloads the model, writes the run config with an API key, starts serving, then stops so systemd can start it.
    # Each preset has its own folder.
    # --data-dir names that folder: strata launch does not read STRATA_DATA_DIR, only --data-dir or its last folder.
    - name: Set up the Strata presets
      vars:
        strata_item: "{{ item }}"
      ansible.builtin.shell:
        cmd: >-
          {{ strata_bin }} launch --family {{ strata_presets[item].family }} --model {{ strata_presets[item].model }}
          --context {{ strata_presets[item].context | default(strata_context) }} --vision gpu --access lan --port {{ engine_ports.strata }}
          --data-dir {{ strata_data_dir }} --save-preset {{ item }} --yes --no-tui
          && {{ strata_bin }} launch --stop --preset {{ item }}
      environment:
        STRATA_DATA_DIR: "{{ strata_data_dir }}"
      become: false
      changed_when: true
      async: 43200
      poll: 60
      loop: "{{ strata_order }}"
  always:
    - name: Restore an installed default engine after the Strata changes
      ansible.builtin.systemd_service:
        name: "{{ default_engine }}"
        state: started
      when: (default_engine ~ '.service') in (ansible_facts.services | default({}))

- name: Install and start the strata service
  ansible.builtin.include_role:
    name: base
    tasks_from: engine_unit
  vars:
    base_engine: strata
    base_engine_description: Strata {{ strata_preset }} API (port {{ engine_ports.strata }}, API key required)
    base_engine_service: |
      Environment="STRATA_DATA_DIR={{ strata_data_dir }}"
      {% for k, v in (strata_env | combine(strata_presets[strata_preset].env | default({}))).items() %}
      Environment="{{ k }}={{ v }}"
      {% endfor %}
      ExecStart={{ strata_bin }} serve --host 0.0.0.0 --port {{ engine_ports.strata }} \
        --profile {{ strata_state }}/{{ strata_preset }}.json
      # strata serve exits with 130 when it stops while it loads the model.
      SuccessExitStatus=130

# A strata that ran before the playbook runs again, on the new preset when it changed.
- name: Start strata again if it ran before
  ansible.builtin.systemd_service:
    name: strata
    state: "{{ 'restarted' if base_engine_unit is changed else 'started' }}"
  when: default_engine != 'strata' and strata_was_running
