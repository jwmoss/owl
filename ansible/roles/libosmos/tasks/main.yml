---
- name: Clone libosmos
  ansible.builtin.git:
    repo: https://github.com/mrsirg97-rgb/libosmos
    dest: "/home/{{ ansible_user }}/src/libosmos"
    version: "{{ libosmos_commit }}"
  become: false

- name: Copy osmos from the model store
  ansible.builtin.include_role:
    name: model_cache
    tasks_from: pull
  vars:
    model_cache_engine: osmos
  when: model_cache_nfs | length > 0

# The installer builds the engine and downloads about 348 GB at pinned commits, checked by SHA-256.
# The marker names the commit and the settings, so a change runs the installer again.
- name: Build libosmos and download the DeepSeek pack
  ansible.builtin.shell:
    cmd: >-
      python3 tools/install/osmos_install.py {{ libosmos_pack }} --models {{ models_dir }}/osmos
      {{ '--abliterated' if libosmos_abliterated else '' }}
      && touch {{ libosmos_marker }}
    chdir: "/home/{{ ansible_user }}/src/libosmos"
    creates: "{{ libosmos_marker }}"
  vars:
    libosmos_marker: >-
      {{ models_dir }}/osmos/{{ libosmos_pack }}/.installed-{{ libosmos_commit
      }}{{ '-abliterated' if libosmos_abliterated else '' }}
  environment:
    PATH: "/opt/rocm/bin:/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
  become: false
  async: 86400
  poll: 60

- name: Save osmos to the model store
  ansible.builtin.include_role:
    name: model_cache
    tasks_from: push
  vars:
    model_cache_engine: osmos
  when: model_cache_nfs | length > 0

- name: Install the osmos service
  register: libosmos_unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/osmos.service
    mode: "0644"
    content: |
      [Unit]
      Description=libosmos DeepSeek-V4.1-Flash API (port {{ libosmos_port }})
      After=network-online.target
      Wants=network-online.target
      # Each engine uses almost all memory, so only one runs.
      Conflicts=strata.service maya.service gufo.service halogen.service

      [Service]
      User={{ ansible_user }}
      {% for k, v in libosmos_env.items() %}
      Environment="{{ k }}={{ v }}"
      {% endfor %}
      ExecStart=/home/{{ ansible_user }}/src/libosmos/bin/osmos-api --host 0.0.0.0 --port {{ libosmos_port }} \
        --config {{ models_dir }}/osmos/{{ libosmos_pack }}/osmos.json
      ExecStartPre=/usr/local/bin/owl-wait-memory
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

# Restart the default engine when its unit changes (a new image or setting), else make sure it runs.
- name: Set the osmos service state
  ansible.builtin.systemd_service:
    name: osmos
    enabled: "{{ default_engine == 'libosmos' }}"
    state: "{{ ('restarted' if libosmos_unit is changed else 'started') if default_engine == 'libosmos' else omit }}"
    daemon_reload: true
