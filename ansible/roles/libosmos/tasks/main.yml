---
- name: Clone libosmos
  ansible.builtin.git:
    repo: https://github.com/mrsirg97-rgb/libosmos
    dest: "/home/{{ ansible_user }}/src/libosmos"
    version: "{{ libosmos_commit }}"
  become: false

# The installer builds the engine and downloads about 348 GB at pinned commits, checked by SHA-256.
- name: Build libosmos and download the DeepSeek pack
  ansible.builtin.command:
    cmd: python3 tools/install/osmos_install.py {{ libosmos_pack }} {{ '--abliterated' if libosmos_abliterated else '' }}
    chdir: "/home/{{ ansible_user }}/src/libosmos"
    creates: "/home/{{ ansible_user }}/Models/osmos/{{ libosmos_pack }}/osmos.json"
  environment:
    PATH: "/opt/rocm/bin:/home/{{ ansible_user }}/.local/bin:{{ ansible_env.PATH }}"
  become: false
  async: 86400
  poll: 60

- name: Install the osmos service
  ansible.builtin.copy:
    dest: /etc/systemd/system/osmos.service
    mode: "0644"
    content: |
      [Unit]
      Description=libosmos DeepSeek-V4.1-Flash API (port {{ libosmos_port }})
      After=network-online.target
      Wants=network-online.target
      # Each engine uses almost all memory, so only one runs.
      Conflicts=strata.service maya.service gufo.service halogen.service

      [Service]
      User={{ ansible_user }}
      ExecStart=/home/{{ ansible_user }}/src/libosmos/bin/osmos-api --host 0.0.0.0 --port {{ libosmos_port }} \
        --config /home/{{ ansible_user }}/Models/osmos/{{ libosmos_pack }}/osmos.json
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

- name: Set the osmos service state
  ansible.builtin.systemd_service:
    name: osmos
    enabled: "{{ default_engine == 'libosmos' }}"
    daemon_reload: true
