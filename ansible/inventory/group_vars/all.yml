---
# Defaults for an AMD Strix Halo machine (Ryzen AI Max+ 395, gfx1151, 128 GB) on Ubuntu Server 26.04 LTS.
# Override a value for one machine in inventory/host_vars/<host>.yml.
# Renovate opens a PR when a pin with a "# renovate:" comment gets a new version (renovate.json).

rocm_version: "7.14.1"
rocm_sha256: "c40e8f2bd6630a7d11557c762b99c6fa8afb04c9bd0e51ed1675ee1ca24afb00"
ttm_pages_limit: 29637703 # about 113 GiB of 4 KiB pages

# renovate: datasource=github-releases depName=Niko1221/Strata
strata_release: "v0.2.13"
strata_model: iq3_s
strata_context: 128k
strata_port: 8080

# renovate: datasource=github-tags depName=mrsirg97-rgb/libosmos
libosmos_commit: "9142b2293c54af3d8de4d88ebff146e3f4b7d63d" # v0.6.1
libosmos_pack: ud-iq1_m
libosmos_abliterated: true
libosmos_port: 8091

# The engine that starts at boot: strata, libosmos, gufo, maya or halogen. Each one uses almost all memory, so only one runs.
default_engine: halogen

# renovate: datasource=docker depName=ghcr.io/gufo-org/toolboxes/gufo-runtime
gufo_image: "ghcr.io/gufo-org/toolboxes/gufo-runtime:0.33.0"
# unsloth: the model, the MTP head and the picture reader. Most new revisions change only the README.
# renovate: datasource=git-refs depName=https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF
gufo_qwen_revision: "084c631ac221016019d6e0a863afe92d90edd3b0" # main
# true: huihui-ai's abliterated v2 of the same UD-Q4_K_XL quant (about 112 GB more). gufo keeps unsloth's MTP head.
gufo_abliterated: false
gufo_model_repo: "{{ 'huihui-ai/Huihui-Qwen3.8-Flash-Next-abliterated-v2-GGUF' if gufo_abliterated else 'unsloth/Qwen3.8-Flash-Next-GGUF' }}"
# renovate: datasource=git-refs depName=https://huggingface.co/huihui-ai/Huihui-Qwen3.8-Flash-Next-abliterated-v2-GGUF
gufo_abliterated_revision: "cbc7fba13f1939ac3fa42b18d77ccf43847d74ef" # main
gufo_model_revision: "{{ gufo_abliterated_revision if gufo_abliterated else gufo_qwen_revision }}"
gufo_model_file: "{{ 'unsloth-UD-Q4_K_XL-V2' if gufo_abliterated else 'UD-Q4_K_XL' }}/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"
gufo_model_dir: "/home/{{ ansible_user }}/Models/gufo/{{ gufo_model_repo | basename }}"
gufo_hf_token: "{{ lookup('ansible.builtin.file', '~/.cache/huggingface/token', errors='ignore') | default('', true) }}"
gufo_port: 8081

# renovate: datasource=github-tags depName=mw00/project-maya
maya_commit: "f4067232fa599494122508b55556c4dbaad945ba" # v1.1.58
maya_port: 8099
# Leave headroom below the shared GPU memory limit on a 128 GB Strix Halo.
maya_vram_reserve_mib: 16384

# renovate: datasource=docker depName=ghcr.io/peonist-ai/halogen-flash-server
halogen_image: "ghcr.io/peonist-ai/halogen-flash-server:0.20.1"
# renovate: datasource=git-refs depName=https://huggingface.co/peonist-ai/halogen-qwen3.8-flash-next
halogen_weights_revision: "4d104c338a40057957c284550bf6058d6cd43405" # main
# true: Quat3rnion's uncensored v2 (about 89 GB more on disk). Same speed, refusals removed.
halogen_abliterated: false
halogen_abliterated_revision: "e7783c5822dfda2785a0f5b435abf54df89fe8ee" # r2, validated with the stock companions
halogen_abliterated_sha256: "7bbac319851b500639462133085156b4f998dec562f511e65ca1c14d7af5163e"
halogen_port: 8731
