---
# Defaults for an AMD Strix Halo machine (Ryzen AI Max+ 395, gfx1151, 128 GB) on Ubuntu Server 26.04 LTS.
# Override a value for one machine in inventory/host_vars/<host>.yml.
# Renovate opens a PR when a pin with a "# renovate:" comment gets a new version (renovate.json).

rocm_version: "7.14.1"
rocm_sha256: "c40e8f2bd6630a7d11557c762b99c6fa8afb04c9bd0e51ed1675ee1ca24afb00"
ttm_pages_limit: 29637703 # about 113 GiB of 4 KiB pages

# renovate: datasource=github-releases depName=Niko1221/Strata
strata_release: "v0.2.13"
# The Strata models, by preset name: a --family and --model of strata launch, and optional context and env.
# strata_preset is the one the strata service serves. Swap: ansible-playbook strata.yml -e strata_preset=<name>.
strata_presets:
  qwen: { family: qwen, model: iq3_s } # Qwen3.8-Flash-Next, the ISTA-DAS quant
strata_preset: qwen
strata_context: 128k
strata_port: 8080
strata_env: {} # environment variables for every Strata preset, for example { NAME: "value" }; a preset's env adds to them


# Every engine keeps its model files in <models_dir>/<engine>, set by the engine's own option.
models_dir: /home/{{ ansible_user }}/models

# Optional model store on an NFS share, for example "tower:/mnt/user/huggingface". Set it in host_vars. Empty: no store.
# Every model in your lists stays on the SSD; the store is a backup. Each model is saved there after its setup,
# and a fresh machine copies it back from there instead of downloading it from Hugging Face.
model_cache_nfs: ""
model_cache_dir: /mnt/model-cache

# The engine that starts at boot: strata, maya or halogen. Each one uses almost all memory, so only one runs.
default_engine: halogen


# renovate: datasource=github-tags depName=mw00/project-maya
maya_commit: "6651b5b1a3bf6fdff61f24ee2e5b331b1fd5b793" # v1.1.63
maya_port: 8099
# The Maya models, by name: the --model options of maya.sh, and optional context (tokens) and env for that model only.
# maya_model is the one the maya service serves. Swap: ansible-playbook maya.yml -e maya_model=glm.
maya_models:
  deepseek: { model: deepseek-maya-xs } # DeepSeek-V4.1-Flash-1017
  glm: { model: glm-maya-s } # GLM-5.3-Flash
maya_model: deepseek
maya_env: {} # environment variables for every Maya model, for example { NAME: "value" }; a model's env adds to them
# Leave headroom below the shared GPU memory limit on a 128 GB Strix Halo.
maya_vram_reserve_mib: 16384

# renovate: datasource=docker depName=ghcr.io/peonist-ai/halogen-flash-server
halogen_image: "ghcr.io/peonist-ai/halogen-flash-server:0.20.4"
# renovate: datasource=git-refs depName=https://huggingface.co/peonist-ai/halogen-qwen3.8-flash-next
halogen_weights_revision: "f5a151cf3f5fac07c2da30cb9af08066231c9ef0" # main
# true: Quat3rnion's uncensored v2 (about 89 GB more on disk). Same speed, refusals removed.
halogen_abliterated: false
halogen_abliterated_revision: "e7783c5822dfda2785a0f5b435abf54df89fe8ee" # r2, validated with the stock companions
halogen_abliterated_sha256: "7bbac319851b500639462133085156b4f998dec562f511e65ca1c14d7af5163e"
halogen_port: 8731
# Small models on the NPU beside the Flash model, on the same port, for example
# "decider-0.8b,qwen3-embedding-0.6b,qwen3-reranker-0.6b,qwen3guard-gen-0.6b,qwen3.5-2b" (about 8 GiB more memory).
# halogen fetches them on its first start. Empty: no NPU. See https://peonist.ai/halogen/docs/NPU/
halogen_npu_models: ""
# Any other halogen setting, as environment variables. The list: https://peonist.ai/halogen/docs/FLAGS/
# For example { HALOGEN_WEIGHTS_LOCK: "1" }
halogen_env: {}

# Tailscale is optional: only tailscale.yml installs it.
# renovate: datasource=github-releases depName=tailscale/tailscale
tailscale_version: "v1.104.7"
# Ansible logs the machine in with the auth key in this file on your computer, outside the repo.
# Make a one-off key in the Tailscale admin console. No file: the playbook shows a login URL and waits.
tailscale_authkey: "{{ lookup('ansible.builtin.file', '~/.config/tailscale/authkey', errors='ignore') | default('', true) }}"
